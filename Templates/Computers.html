<div class="shell" id="shell" hidden><a class="skip" href="#main">Skip to inventory</a><aside class="sidebar" aria-label="Inventory navigation"><div class="brand"><span class="brandmark" id="brandicon" aria-hidden="true">JP</span><div>PSInsightInventory<small>DIRECTORY INVENTORY</small></div></div><nav id="nav"></nav><div class="sidefoot"><b><span class="dot"></span>Offline snapshot</b><span id="scopefoot"></span></div></aside><div class="workspace"><header class="topbar"><button class="iconbtn mobilemenu" id="menu" aria-label="Toggle navigation" aria-expanded="false"></button><div class="crumb">Forest inventory <span>/</span> <b id="crumb">Overview</b></div><div class="spacer"></div><span class="topmeta" id="generated"></span><span class="pill" id="sourcebadge"></span><button class="iconbtn" id="theme" aria-label="Switch to dark theme"></button></header><main id="main" tabindex="-1"></main></div></div><div class="toast" role="status" id="toast"></div>
<script id="snapshot" type="application/json">/*DATA*/</script>
<script>


'use strict';
const P=JSON.parse(document.getElementById('snapshot').textContent),D=P.data,S=P.sections,M=P.meta,C=P.coverage;
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const state={key:'computers',overview:true,query:'',mode:'',page:1,size:10,sort:'Name',desc:false,detail:null,hidden:{},filters:{}};
const icons={grid:'M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z',search:'M10 3a7 7 0 1 0 0 14a7 7 0 1 0 0-14M15 15l6 6',menu:'M4 6h16M4 12h16M4 18h16',moon:'M20 15A9 9 0 0 1 9 4a9 9 0 1 0 11 11',sun:'M12 8a4 4 0 1 0 0 8a4 4 0 1 0 0-8M12 2v2M12 20v2M2 12h2M20 12h2',download:'M12 3v12M7 10l5 5 5-5M4 16v5h16v-5',info:'M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18M12 11v6M12 7h.01'};
const icon=k=>`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${icons[k]||icons.grid}"/></svg>`;
function available(k){return !!C[k];}
function count(k){return available(k)?D[k].length:'Unknown';}
function nav(){const items=[['overview','Inventory overview'],...Object.entries(S).map(([k,v])=>[k,v[0]])];$('#nav').innerHTML='<div class="group-label">Computer configuration</div>'+items.map(([k,l])=>`<button class="navbtn ${(!state.detail&&(k==='overview'?state.overview:!state.overview&&state.key===k))?'active':''}" data-section="${k}">${icon('grid')}<span>${esc(l)}</span><span class="navcount">${k==='overview'?'':count(k)}</span></button>`).join('');}
function fmt(v){return v===null||v===undefined?'<span class="tag">Unknown / not returned</span>':v===true?'<span class="tag teal">Yes</span>':v===false?'<span class="tag">No</span>':esc(v);}
function footer(){return `<footer class="footer"><span>JP · PSInsightInventory ${esc(M.version)}</span><span>Run ${esc(M.run)}</span><span>${esc(M.generatedDisplay)} · ${esc(M.dataSource)} · Selected domain</span></footer>`;}
function rows(){let r=D[state.key].map((record,index)=>({record,index})).filter(({record:r})=>(state.key!=='computers'||Object.entries(state.filters).every(([k,v])=>(k==='Location DN'?String(r[k]??'').toLowerCase()===String(v??'').toLowerCase():JSON.stringify(r[k]??null)===JSON.stringify(v))))&&(!state.query||Object.values(r).some(v=>String(v??'').toLowerCase().includes(state.query.toLowerCase())))&&(!state.mode||(state.mode==='empty'?r['DC objects']===0:state.mode==='unassigned'?String(r.Assignment).startsWith('Unassigned'):state.mode==='gaps'?r.Status!=='Succeeded':true)));return r.sort((a,b)=>String(a.record[state.sort]??'').localeCompare(String(b.record[state.sort]??''),undefined,{numeric:true})*(state.desc?-1:1));}
function cell(c,v,k,index){if(c==='Name'&&k!=='collection')return `<button class="dclink" data-object="${k}:${index}">${esc(v)} →</button>`;if(c==='Status')return `<span class="tag ${v==='Succeeded'?'teal':'amber'}">${esc(v)}</span>`;return `<span title="${esc(v??'Not set or not returned')}">${fmt(v)}</span>`;}
function table(k,list,sortable=false){const cols=S[k][1].filter(c=>!sortable||!(state.hidden[k]||[]).includes(c));return `<div class="tablewrap"><table><thead><tr>${cols.map(c=>`<th>${sortable?`<button data-sort="${esc(c)}">${esc(c)} ${state.sort===c?state.desc?'↓':'↑':'↕'}</button>`:esc(c)}</th>`).join('')}</tr></thead><tbody>${list.map(({record:r,index:i})=>`<tr>${cols.map(c=>`<td>${cell(c,r[c],k,i)}</td>`).join('')}</tr>`).join('')}</tbody></table>${list.length?'':`<div class="empty"><b>${available(k)?'No matching records':'Collection unavailable or incomplete'}</b>${available(k)?'Zero rows can be valid. Review filters and Collection.':'A failed query does not establish that no objects exist.'}</div>`}</div>`;}
function grid(){const all=rows(),pages=Math.max(1,Math.ceil(all.length/state.size));state.page=Math.min(state.page,pages);const start=(state.page-1)*state.size;return table(state.key,all.slice(start,start+state.size),true)+`<div class="tfoot"><span role="status">${all.length?start+1:0}–${Math.min(start+state.size,all.length)} of ${all.length} rows</span><span class="spacer"></span><span>Page ${state.page} of ${pages}</span><button class="btn" data-action="prev" ${state.page===1?'disabled':''}>Previous</button><button class="btn" data-action="next" ${state.page===pages?'disabled':''}>Next</button></div>`;}
const osFields=['OS family','OS reported','Server release','Version reported','Build reported'];
function cards(){return `<div class="cards">${[['Computers observed',D.computers.length,'Returned directory computer objects','computers'],['OS/version groups',D.osSummary.length,'Names and versions reported by AD','osSummary'],['Directory locations',D.locations.length,'Immediate parent DNs','locations'],['Collection gaps',D.collection.filter(r=>r.Status!=='Succeeded').length,'Unknown data is not an empty population','collection']].map(([l,n,note,k])=>`<button class="metric" data-section="${k}"><span class="metrichead">${l}${icon('grid')}</span><span class="metricvalue"><strong>${n}</strong></span><div class="metricfoot">${note}</div></button>`).join('')}</div>`;}
function osOverview(){return `<section class="panel" style="margin-bottom:20px"><div class="panelhead"><h2>OS and version breakdown · AD-reported</h2></div><div class="dist">${D.osSummary.map((r,i)=>`<button class="btn" style="margin:4px" data-section="computers" data-os-index="${i}">${esc(r.Name)} · ${esc(r['Version reported']??'Unknown version')} · ${r['Computers observed']}</button>`).join('')||'No OS observations. Review collection coverage.'}</div></section>`;}
function computerFilters(){return state.key!=='computers'?'':`<div class="toolbar">${[...osFields,'Enabled','DC role reported','Location DN'].map(c=>{const values=[...new Map(D.computers.map(r=>[JSON.stringify(r[c]??null),r[c]??null])).values()];return `<label style="font-size:10px">${esc(c)} <select data-filter="${esc(c)}" aria-label="Filter ${esc(c)}"><option value="">All</option>${values.map(v=>`<option value="${esc(JSON.stringify(v))}" ${Object.hasOwn(state.filters,c)&&JSON.stringify(state.filters[c])===JSON.stringify(v)?'selected':''}>${esc(v===null?'Unknown / not returned':String(v))}</option>`).join('')}</select></label>`;}).join('')}</div>`;}
function controls(){return computerFilters()+`<div class="toolbar"><label class="searchbox">${icon('search')}<input id="query" type="search" aria-label="Search inventory" placeholder="Search ${esc(S[state.key][0].toLowerCase())}…" value="${esc(state.query)}"></label>${['sites','subnets','collection'].includes(state.key)?`<select id="mode" aria-label="Filter records"><option value="">All records</option><option value="${state.key==='sites'?'empty':state.key==='subnets'?'unassigned':'gaps'}" ${state.mode?'selected':''}>${state.key==='sites'?'Without DC objects':state.key==='subnets'?'Unassigned values':'Unavailable queries'}</option></select>`:''}<button class="textbtn" data-action="reset">Reset</button><span class="spacer"></span><details class="columnmenu"><summary class="btn">Columns</summary><div class="columnoptions">${S[state.key][1].map((c,i)=>`<label><input type="checkbox" data-col="${esc(c)}" ${!(state.hidden[state.key]||[]).includes(c)?'checked':''} ${i===0?'disabled':''}>${esc(c)}</label>`).join('')}</div></details><button class="btn" data-action="csv">${icon('download')}Filtered CSV</button></div>`;}
function scheduleView(s){if(!s||s['Parse status']!=='Parsed')return `<div class="detailnote">${esc(s?.Summary||'No schedule evidence available.')}</div>`;const masks=s['Hourly masks UTC'],days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];return `<section class="panel detailsection"><div class="panelhead"><div><h2>Stored weekly schedule · UTC</h2><p>${esc(s.Summary)} Each cell is one UTC hour; intensity shows permitted quarter count.</p></div></div><div class="tablewrap"><table><thead><tr><th>UTC</th>${Array.from({length:24},(_,i)=>`<th>${String(i).padStart(2,'0')}</th>`).join('')}</tr></thead><tbody>${days.map((d,i)=>`<tr><th>${d}</th>${Array.from({length:24},(_,h)=>{const n=parseInt(masks[i*24+h],16),q=[1,2,4,8].filter(b=>n&b).length;return `<td style="padding:8px;text-align:center;background:color-mix(in srgb,var(--accent) ${q*19}%,var(--surface))" title="${d} ${h}:00 UTC · ${q}/4 quarters allowed · raw mask 0x${n.toString(16)}">${q}/4</td>`;}).join('')}</tr>`).join('')}</tbody></table></div><div class="dist"><p style="font-size:10px">Stored schedule only. Transport ignore-schedule settings and combined paths can change effective behavior. Raw masks are retained without converting them to local time.</p></div></section>`;}
const sameDN=(a,b)=>String(a??'').toLowerCase()===String(b??'').toLowerCase();
function related(k,predicate){const list=D[k].map((r,index)=>({record:r,index})).filter(x=>predicate(x.record));return `<section class="panel detailsection"><div class="panelhead"><h2>${esc(S[k][0])}</h2><span class="spacer"></span><span class="tag">${list.length} observed rows</span></div>${table(k,list)}</section>`;}
function detail(){const {key:k,index:i}=state.detail,r=D[k][i];$('#crumb').textContent=r.Name;let content=`<button class="textbtn" data-action="back">← Back to ${esc(S[state.key][0])}</button><div class="detailhero"><span class="brandmark">JP</span><div><div class="eyebrow">${esc(S[k][0])} / Configuration</div><h1>${esc(r.Name)}</h1><p class="subtitle">${esc(M.connectionDomain)} · Selected domain inventory</p></div></div><section class="panel detailsection"><div class="panelhead"><h2>Object properties</h2></div><dl class="props">${S[k][1].map(c=>`<dt>${esc(c)}</dt><dd>${fmt(r[c])}</dd>`).join('')}</dl></section>`;
 if(k==='computers'){for(const key of ['spns','delegation'])content+=related(key,x=>x['Computer ID']===r['Computer ID']);}
 if(['spns','delegation'].includes(k))content+=related('computers',x=>x['Computer ID']===r['Computer ID']);
 if(k==='osSummary')content+=`<button class="btn primary" data-section="computers" data-os-index="${i}">Open matching computers (${r['Computers observed']})</button>`;
 if(k==='locations')content+=`<button class="btn primary" data-section="computers" data-location-index="${i}">Open matching computers (${r['Computers observed']})</button>`;
 $('#main').innerHTML=content+footer();}
function render(){nav();if(state.detail){detail();return;}$('#crumb').textContent=state.overview?'Computer Inventory':S[state.key][0];const success=D.collection.filter(r=>['Succeeded','NotApplicable'].includes(r.Status)).length;$('#main').innerHTML=`<div class="pagehead"><div><div class="eyebrow">Domain / Computer configuration</div><h1>${state.overview?'Computer Inventory':esc(S[state.key][0])}</h1><p class="subtitle">Directory computers and OS breakdowns · fixed snapshot</p></div><span class="spacer"></span><button class="btn primary" data-action="json">${icon('download')}Export snapshot</button></div><div class="notice">${icon('info')}<span><b>${esc(M.dataSource)} · Selected domain scope.</b> ${esc(M.notice)} ${success}/${M.expectedQueries} categories collected. Counts describe observed configurations, not service health.</span></div>${state.overview?cards()+osOverview()+`<section class="panel" style="margin-bottom:20px"><div class="panelhead"><h2>Collection scope</h2></div><dl class="props">${[['Domain',M.connectionDomain],['Source DC',M.sourceDC],['Data origin','AD-reported attributes'],['Endpoint collection','None']].map(([k,v])=>`<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</dl></section>`:''}<section class="panel"><div class="panelhead"><div><h2>${esc(S[state.key][0])}</h2><p>${state.key==='collection'?'One directory query; other datasets are derived from the returned computer objects.':state.key==='servers'?'Directory server and NTDS objects; no endpoint availability probe.':'Select an object name for its properties and related records.'}</p></div><span class="spacer"></span><span class="tag ${available(state.key)?'':'amber'}">${available(state.key)?'Source collected':'Source unavailable / partial'}</span></div>${controls()}<div id="gridbody">${grid()}</div></section><section class="panel" style="margin-top:20px"><div class="panelhead"><h2>Interpretation</h2></div><div class="dist"><ul style="font-size:11px;color:var(--muted)">${M.limitations.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></section>${footer()}`;}
function navigate(k,mode=''){state.key=k==='overview'?'computers':k;state.overview=k==='overview';state.query='';state.filters={};state.mode=mode;state.page=1;state.sort='Name';state.desc=false;state.detail=null;$('#shell').classList.remove('menuopen');$('#menu').setAttribute('aria-expanded','false');render();window.scrollTo(0,0);}
function download(name,text,type){const url=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);$('#toast').textContent='Exported '+name;setTimeout(()=>$('#toast').textContent='',3000);}
function csvText(list,cols){const q=v=>'"'+String(/^[=+@\-\t\r\n]/.test(String(v??''))?"'"+v:v??'').replace(/"/g,'""')+'"';return '\ufeff'+[cols.map(q).join(','),...list.map(({record:r})=>cols.map(c=>q(r[c])).join(','))].join('\r\n');}
document.addEventListener('click',e=>{const t=e.target.closest('[data-section],[data-object],[data-action],[data-sort]');if(!t)return;if(t.dataset.section){navigate(t.dataset.section,t.dataset.mode||'');if(t.dataset.osIndex!==undefined){const r=D.osSummary[Number(t.dataset.osIndex)];state.filters=Object.fromEntries(osFields.map(c=>[c,r[c]??null]));render();}if(t.dataset.locationIndex!==undefined){state.filters={'Location DN':D.locations[Number(t.dataset.locationIndex)]['Location DN']};render();}return;}if(t.dataset.object){const [key,index]=t.dataset.object.split(':');state.detail={key,index:Number(index)};render();window.scrollTo(0,0);return;}if(t.dataset.sort){state.desc=state.sort===t.dataset.sort?!state.desc:false;state.sort=t.dataset.sort;$('#gridbody').innerHTML=grid();return;}switch(t.dataset.action){case'back':state.detail=null;render();break;case'reset':state.filters={};state.query='';state.mode='';state.page=1;render();break;case'prev':state.page--;$('#gridbody').innerHTML=grid();break;case'next':state.page++;$('#gridbody').innerHTML=grid();break;case'csv':download('Computers-'+state.key+'-filtered.csv',csvText(rows(),S[state.key][1]),'text/csv;charset=utf-8');break;case'json':download('Computers-Snapshot.json',JSON.stringify(P,null,2),'application/json');break;}});
document.addEventListener('input',e=>{if(e.target.id==='query'){state.query=e.target.value;state.page=1;$('#gridbody').innerHTML=grid();}});
document.addEventListener('change',e=>{if(e.target.dataset.filter){const key=e.target.dataset.filter;if(e.target.value==='')delete state.filters[key];else state.filters[key]=JSON.parse(e.target.value);state.page=1;$('#gridbody').innerHTML=grid();}if(e.target.id==='mode'){state.mode=e.target.value;state.page=1;$('#gridbody').innerHTML=grid();}if(e.target.dataset.col){const c=e.target.dataset.col;state.hidden[state.key]=e.target.checked?(state.hidden[state.key]||[]).filter(x=>x!==c):[...(state.hidden[state.key]||[]),c];$('#gridbody').innerHTML=grid();}});
$('#theme').innerHTML=icon('moon');$('#theme').onclick=()=>{const dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'light';$('#theme').innerHTML=icon(dark?'sun':'moon');$('#theme').setAttribute('aria-label','Switch to '+(dark?'light':'dark')+' theme');};
$('#menu').innerHTML=icon('menu');$('#menu').onclick=()=>{const on=$('#shell').classList.toggle('menuopen');$('#menu').setAttribute('aria-expanded',String(on));};document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('#shell').classList.remove('menuopen');$('#menu').setAttribute('aria-expanded','false');document.querySelectorAll('details[open]').forEach(x=>x.open=false);}});
$('#scopefoot').textContent=M.connectionDomain+' · selected domain · v'+M.version;$('#generated').textContent=M.generatedDisplay;$('#sourcebadge').textContent=M.dataSource==='Sample'?'SAMPLE DATA':'LIVE SNAPSHOT';$('#shell').hidden=false;render();



</script></body></html>
