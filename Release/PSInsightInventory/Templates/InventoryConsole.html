<script>
'use strict';
const P=JSON.parse(document.getElementById('snapshot').textContent),D=P.data,S=P.sections,M=P.meta;
const $=(s)=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const glyph={server:'M4 3h16v7H4zM4 14h16v7H4zM7 6h.01M7 17h.01M12 6h5M12 17h5',grid:'M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z',system:'M3 4h18v13H3zM8 21h8M12 17v4',disk:'M4 4h16v16H4zM7 16h10M16 7h1',folder:'M3 6h7l2 2h9v12H3z',network:'M8 3h8v6H8zM3 16h6v5H3zM15 16h6v5h-6zM12 9v4M6 16v-3h12v3',dns:'M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18M3 12h18M12 3c-5 5-5 13 0 18M12 3c5 5 5 13 0 18',arrow:'M4 12h16M14 6l6 6-6 6',link:'M9 15l6-6M8 10l-3 3a4 4 0 0 0 6 6l3-3M16 14l3-3a4 4 0 0 0-6-6l-3 3',clock:'M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18M12 7v5l4 2',role:'M12 3l8 4v6c0 4-8 8-8 8s-8-4-8-8V7zM8 12l3 3 5-6',cert:'M6 3h12v13H6zM9 16v6l3-2 3 2v-6M9 7h6M9 10h6',list:'M8 5h13M8 12h13M8 19h13M3 5h.01M3 12h.01M3 19h.01',search:'M10 3a7 7 0 1 0 0 14a7 7 0 1 0 0-14M15 15l6 6',download:'M12 3v12M7 10l5 5 5-5M4 16v5h16v-5',moon:'M20 15A9 9 0 0 1 9 4a9 9 0 1 0 11 11',sun:'M12 8a4 4 0 1 0 0 8a4 4 0 1 0 0-8M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1 1M18 18l1 1M5 19l1-1M18 6l1-1',info:'M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18M12 11v6M12 7h.01',columns:'M3 4h18v16H3zM9 4v16M15 4v16',back:'M20 12H4M10 6l-6 6 6 6',menu:'M4 6h16M4 12h16M4 18h16'};
const icon=k=>`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${glyph[k]||glyph.list}"/></svg>`;
const groups=[['Workspace',[['overview','Inventory overview','grid']]],['Domain controllers',[['dcs','Controllers','server'],['roles','Directory roles','role']]],['System & storage',[['system','System','system'],['disks','Disks','disk'],['paths','AD paths','folder']]],['Network & DNS',[['network','Network','network'],['forwarders','Forwarders','arrow'],['zones','Zones','dns'],['conditional','Conditional forwarders','link']]],['Sites & replication',[['subnets','Subnets','network'],['partners','Partners','link'],['connections','Connections','link']]],['Services & security',[['time','Time','clock'],['certificates','Certificates','cert'],['shares','Shares','folder']]],['Evidence',[['collection','Collection ledger','list']]]];
const state={section:'overview',query:'',domain:'',site:'',mode:'',page:1,size:8,sort:'Name',desc:false,dc:null,tab:'overview',hidden:{}};
const byName=Object.fromEntries(D.dcs.map(d=>[d.Name,d]));const failures=D.collection.filter(r=>!['Succeeded','NotApplicable'].includes(r.Status));const complete=D.dcs.filter(d=>d.Inventory==='Complete').length;
const footer=()=>`<footer class="footer"><span>JP · PSInsightInventory</span><span>Run ${esc(M.run)} · ${esc(M.version)}</span><span>Generated ${esc(M.generatedDisplay)} · ${esc(M.dataSource)} snapshot</span></footer>`;
const notice=()=>`<div class="notice">${icon('info')}<span><b>${esc(M.dataSource)} snapshot.</b> ${esc(M.notice)} Scope: ${esc(M.scope)} · ${M.selectedDCs} selected of ${M.discoveredDCs} discovered DCs. All 17 inventory sections are available.</span></div>`;
function nav(){ $('#nav').innerHTML=groups.map(([g,items])=>`<div class="group-label">${g}</div>${items.map(([id,label,ico])=>`<button class="navbtn ${state.section===id&&!state.dc?'active':''}" data-section="${id}" ${state.section===id&&!state.dc?'aria-current="page"':''}>${icon(ico)}<span>${label}</span><span class="navcount">${id==='overview'?'':D[id].length}</span></button>`).join('')}`).join(''); }
const metric=(title,num,unit,note,ico,action,mode='')=>`<button class="metric" data-section="${action}" data-mode="${mode}"><span class="metrichead">${title}${icon(ico)}</span><span class="metricvalue"><strong>${num}</strong><small>${unit}</small></span><div class="metricfoot">${note}</div></button>`;
function cards(){return `<div class="cards">${metric('Domain controllers',D.dcs.length,'discovered',D.dcs.filter(d=>d.Type==='Writable').length+' writable · '+D.dcs.filter(d=>d.Type==='RODC').length+' read-only','server','dcs')}${metric('Directory scope',new Set(D.dcs.map(d=>d.Domain)).size,'domains','Domain-scoped collection','dns','dcs')}${metric('AD sites',new Set(D.dcs.map(d=>d.Site)).size,'locations','Sites represented by selected controllers','network','subnets')}${metric('Inventory coverage',complete+'/'+D.dcs.length,'DCs complete',failures.length+' collection gaps across 2 controllers','list','dcs','partial')}</div>`;}
function bars(field,short=false){const counts={};D.dcs.forEach(d=>counts[d[field]]=(counts[d[field]]||0)+1);return Object.entries(counts).map(([k,v])=>`<div class="barrow"><span>${esc(short?k.replace('Windows Server ','Server '):k)}</span><div class="track"><div class="fill" style="width:${100*v/D.dcs.length}%"></div></div><b>${v}</b></div>`).join('');}
function overview(){const collected=D.collection.filter(r=>r.Status==='Succeeded').length,na=D.collection.filter(r=>r.Status==='NotApplicable').length,eligible=D.collection.length-na,ratio=eligible?collected/eligible:1;return `<div class="overviewgrid"><section class="panel"><div class="panelhead"><div><h2>Operating systems</h2><p>Controller distribution · ${D.dcs.length} records</p></div></div><div class="dist">${bars('OS',true)}</div></section><section class="panel"><div class="panelhead"><div><h2>Sites at a glance</h2><p>Distinct site names in the selected inventory</p></div></div><div class="dist">${bars('Site')}</div></section><section class="panel"><div class="panelhead"><div><h2>Collection coverage</h2><p>Attempted category operations; excludes not applicable</p></div></div><div class="coverage"><div class="ring" style="--angle:${360*ratio}deg"><div class="ringin"><b>${(100*ratio).toFixed(1)}%</b><small>COLLECTED</small></div></div><div class="legend"><div><b>${collected}</b> collected of ${eligible} applicable</div><div><b>${failures.length}</b> unavailable · ${na} not applicable</div><a href="#collection" data-section="collection" data-mode="gaps">Review collection gaps →</a></div></div></section></div>`;}
const currentKey=()=>state.section==='overview'?'dcs':state.section;
function rows(){let r=D[currentKey()].filter(r=>{const d=byName[r.Name];return(!state.domain||d.Domain===state.domain)&&(!state.site||d.Site===state.site)&&(!state.query||Object.values(r).some(v=>String(v).toLowerCase().includes(state.query.toLowerCase())))&&(!state.mode||(state.mode==='partial'?d.Inventory==='Partial':state.mode==='gaps'?!['Succeeded','NotApplicable'].includes(r.Status):true));});return r.sort((a,b)=>String(a[state.sort]??'').localeCompare(String(b[state.sort]??''),undefined,{numeric:true})*(state.desc?-1:1));}
function opts(values,selected,all){return `<option value="">${all}</option>`+[...new Set(values)].map(x=>`<option value="${esc(x)}" ${x===selected?'selected':''}>${esc(x)}</option>`).join('');}
function controls(){const k=currentKey(),cols=S[k][1],hidden=state.hidden[k]||[];return `<div class="toolbar"><label class="searchbox">${icon('search')}<input id="query" type="search" placeholder="Search ${esc(S[k][0].toLowerCase())}…" value="${esc(state.query)}" aria-label="Search current inventory"></label><select id="domain" aria-label="Filter by domain">${opts(D.dcs.map(d=>d.Domain),state.domain,'All domains')}</select><select id="site" aria-label="Filter by site">${opts(D.dcs.map(d=>d.Site),state.site,'All sites')}</select>${k==='dcs'?`<select id="mode" aria-label="Inventory coverage filter"><option value="">All coverage</option value="partial" ${state.mode==='partial'?'selected':''}>Partial inventory</option></select>`:k==='collection'?`<select id="mode" aria-label="Collection outcome filter"><option value="">All outcomes</option><option value="gaps" ${state.mode==='gaps'?'selected':''}>Collection gaps</option></select>`:''}<button class="textbtn" data-action="reset">Reset</button><div class="spacer"></div><details class="columnmenu"><summary class="btn">${icon('columns')}Columns</summary><div class="columnoptions">${cols.map((c,i)=>`<label><input type="checkbox" data-col="${esc(c)}" ${!hidden.includes(c)?'checked':''} ${i===0?'disabled':''}>${esc(c)}</label>`).join('')}</div></details><button class="btn" data-action="csv">${icon('download')}CSV</button></div>`;}
function cell(col,v){if(v===null||v===undefined)return '<span class="tag">Unknown</span>';if(v===true)v='Yes';if(v===false)v='No';if(col==='Name')return `<button class="dclink" data-dc="${esc(v)}"><span class="servericon">${icon('server')}</span>${esc(v)}</button>`;if(col==='Inventory'||col==='Outcome')return `<span class="tag ${v==='Complete'||v==='Collected'||v==='Not applicable'?'teal':'amber'}">${esc(v)}</span>`;if(['Type','GC','AD integrated','Enabled'].includes(col))return `<span class="tag">${esc(v)}</span>`;return `<span title="${esc(v)}" class="${col==='Domain'?'domaincell':''}">${esc(v)}</span>`;}
function tableHtml(k,list,sortable=false){const cols=S[k][1].filter(c=>!(state.hidden[k]||[]).includes(c));return `<div class="tablewrap"><table><thead><tr>${cols.map(c=>`<th scope="col">${sortable?`<button data-sort="${esc(c)}">${esc(c)}${state.sort===c?state.desc?' ↓':' ↑':' ↕'}</button>`:esc(c)}</th>`).join('')}</tr></thead><tbody>${list.map(r=>`<tr>${cols.map(c=>`<td>${cell(c,r[c])}</td>`).join('')}</tr>`).join('')}</tbody></table>${!list.length?'<div class="empty"><b>No matching records</b>Try clearing a filter or using a different search.</div>':''}</div>`;}
function gridBody(){const k=currentKey(),r=rows(),pages=Math.max(1,Math.ceil(r.length/state.size));state.page=Math.min(state.page,pages);const start=(state.page-1)*state.size;return tableHtml(k,r.slice(start,start+state.size),true)+`<div class="tfoot"><span role="status">${r.length?start+1:0}–${Math.min(start+state.size,r.length)} of ${r.length} records${state.mode==='partial'?' · Partial inventory':state.mode==='gaps'?' · Collection gaps':''}</span><span class="spacer"></span><span>Page ${state.page} of ${pages}</span><button class="btn" data-action="prev" ${state.page===1?'disabled':''}>Previous</button><button class="btn" data-action="next" ${state.page===pages?'disabled':''}>Next</button></div>`;}
function categoryCoverage(){const rs=D.collection.filter(r=>r['Check ID']===currentKey()),count=s=>rs.filter(r=>r.Status===s).length;return `<div class="categorycoverage"><span><b>Snapshot coverage:</b> ${count('Succeeded')} collected · ${count('NotApplicable')} not applicable · ${rs.filter(r=>!['Succeeded','NotApplicable'].includes(r.Status)).length} unavailable / excluded</span><button class="textbtn" data-section="collection">View collection ledger →</button></div>`;}
function render(){nav();$('#crumb').textContent=state.dc?state.dc:state.section==='overview'?'Overview':S[state.section][0];if(state.dc){detail();return;}const k=currentKey();$('#main').innerHTML=`<div class="pagehead"><div><div class="eyebrow">Directory / Inventory</div><h1>${state.section==='overview'?'Domain Controller Inventory':esc(S[k][0])}</h1><p class="subtitle">${state.section==='overview'?'A structured view of your directory infrastructure. Explore by category or by controller.':'Browse '+esc(S[k][0].toLowerCase())+' across the selected domain. Select a controller to see its complete profile.'}</p></div><span class="spacer"></span><button class="btn primary" data-action="json">${icon('download')}Export snapshot</button></div>${notice()}${state.section==='overview'?cards()+overview():''}<section class="panel"><div class="panelhead"><div><h2>${state.section==='overview'?'Controller directory':esc(S[k][0])}</h2><p>${k==='subnets'?'Subnets assigned to each controller’s AD site; not an IP-to-subnet validation. Repeated per observing DC.':k==='collection'?'Collection outcomes are separate from infrastructure health. Not applicable means the role is absent; not attempted means it was excluded.':k==='roles'?'Assigned FSMO roles from discovery. Zero rows is valid; view Collection to distinguish empty from failed.':k==='dcs'?'Select a controller name to explore its inventory profile.':'Category records from the fixed inventory snapshot.'}</p></div><span class="spacer"></span><span class="tag">${D[k].length} total records</span></div>${categoryCoverage()}${controls()}<div id="gridbody">${gridBody()}</div></section>${footer()}`;}
const detailGroups={system:['system','disks','paths'],dns:['network','forwarders','zones','conditional'],directory:['roles','subnets','partners','connections'],services:['time','certificates','shares'],collection:['collection']};
const props=obj=>`<dl class="props">${Object.entries(obj).map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>`;
function detail(){const d=byName[state.dc],gaps=failures.filter(r=>r.Name===d.Name),records=D.collection.filter(r=>r.Name===d.Name),counts=Object.fromEntries(Object.keys(S).filter(k=>k!=='collection').map(k=>[S[k][0],D[k].filter(r=>r.Name===d.Name).length]));$('#main').innerHTML=`<button class="textbtn" data-action="back">← Back to ${state.section==='overview'?'inventory overview':esc(S[state.section][0].toLowerCase())}</button><div class="detailhero"><span class="servericon">${icon('server')}</span><div><div class="eyebrow">Controller profile</div><h1>${esc(d.Name)}</h1><p class="subtitle">${esc(d.Name)} · ${esc(d.Site)}</p></div><span class="spacer"></span><span class="pill ${d.Inventory==='Partial'?'amber':''}">${d.Inventory} inventory</span></div><div class="detailtabs" role="tablist" aria-label="Controller details">${[['overview','Overview'],['system','System & storage'],['dns','Network & DNS'],['directory','Directory & topology'],['services','Services & security'],['collection','Collection']].map(([id,l])=>`<button role="tab" aria-selected="${state.tab===id}" class="${state.tab===id?'active':''}" data-tab="${id}">${l}</button>`).join('')}</div>${gaps.length?`<div class="detailnote">${gaps.length} category operation(s) lack evidence: ${gaps.map(g=>esc(g.Section)+' ('+esc(g.Outcome)+')').join(', ')}. Missing inventory does not establish service failure.</div>`:''}${state.tab==='overview'?`<div class="detailgrid"><section class="panel"><div class="panelhead"><h2>Controller identity</h2></div>${props(d)}</section><section class="panel"><div class="panelhead"><h2>Snapshot coverage</h2></div>${props({'Operations collected':records.filter(r=>r.Status==='Succeeded').length+' / '+records.length,'Not applicable':records.filter(r=>r.Status==='NotApplicable').length,'Unavailable operations':gaps.length,'Data source':M.source,'Timestamp':M.generated,'Run ID':M.run,'Interpretation':'Inventory only; no health verdict'})}</section><section class="panel"><div class="panelhead"><h2>Inventory records by category</h2></div>${props(counts)}</section><section class="panel"><div class="panelhead"><h2>Explore this controller</h2></div><div class="dist"><p style="font-size:12px">Use the tabs above to browse system specifications, disk volumes, directory paths, DNS configuration, replication objects and certificates for this controller.</p><p style="font-size:11px;margin-top:16px">This is a fixed inventory snapshot. Zero records can be a valid result. Check Collection to distinguish a successful empty query from a failed or excluded operation. Certificates show public metadata only.</p></div></section></div>`:detailGroups[state.tab].map(k=>{const rs=D[k].filter(r=>r.Name===d.Name),unavailable=gaps.find(g=>g.Section===S[k][0]),entry=records.find(g=>g['Check ID']===k),na=entry?.Status==='NotApplicable';return `<section class="panel detailsection"><div class="panelhead"><h2>${esc(S[k][0])}</h2><span class="spacer"></span><span class="tag ${unavailable?'amber':''}">${unavailable?esc(unavailable.Outcome):na?'Not applicable':rs.length+' records'}</span></div>${rs.length?tableHtml(k,rs):`<div class="empty"><b>${unavailable?'Inventory unavailable':na?'Not applicable':'No records'}</b>${unavailable?esc(unavailable.Message):na?esc(entry.Message):'No inventory records returned in this category.'}</div>`}</section>`}).join('')}${footer()}`;}
function navigate(section,mode=''){state.section=section;state.dc=null;state.tab='overview';state.mode=mode;state.query='';state.domain='';state.site='';state.page=1;state.sort='Name';state.desc=false;$('#shell').classList.remove('menuopen');$('#menu').setAttribute('aria-expanded','false');render();window.scrollTo(0,0);}
function repaint(){state.page=1;$('#gridbody').innerHTML=gridBody();}
function download(name,text,type){const blob=new Blob([text],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);$('#toast').textContent='Exported '+name;setTimeout(()=>$('#toast').textContent='',3500);}
function csvText(rs,columns){const q=v=>'"'+String(/^[=+@\-\t\r\n]/.test(String(v??''))?"'"+v:v??'').replace(/"/g,'""')+'"';return '\ufeff'+[columns.map(q).join(','),...rs.map(r=>columns.map(c=>q(r[c])).join(','))].join('\r\n');}
document.addEventListener('click',e=>{const el=e.target.closest('[data-section],[data-dc],[data-action],[data-sort],[data-tab]');if(!el)return;if(el.dataset.section){e.preventDefault();navigate(el.dataset.section,el.dataset.mode||'');return;}if(el.dataset.dc){state.dc=el.dataset.dc;state.tab='overview';render();window.scrollTo(0,0);return;}if(el.dataset.tab){state.tab=el.dataset.tab;detail();$(`[data-tab="${state.tab}"]`).focus();return;}if(el.dataset.sort){state.desc=state.sort===el.dataset.sort?!state.desc:false;state.sort=el.dataset.sort;$('#gridbody').innerHTML=gridBody();return;}switch(el.dataset.action){case'back':state.dc=null;render();break;case'reset':state.query='';state.domain='';state.site='';state.mode='';state.page=1;render();break;case'prev':state.page--;$('#gridbody').innerHTML=gridBody();break;case'next':state.page++;$('#gridbody').innerHTML=gridBody();break;case'csv':download((M.dataSource==='Sample'?'SAMPLE-':'')+currentKey()+'-filtered.csv',csvText(rows(),S[currentKey()][1]),'text/csv;charset=utf-8');break;case'json':download((M.dataSource==='Sample'?'SAMPLE-':'')+'DC-Inventory-Snapshot.json',JSON.stringify(P,null,2),'application/json');break;}});
document.addEventListener('input',e=>{if(e.target.id==='query'){state.query=e.target.value;repaint();}});
document.addEventListener('change',e=>{if(['domain','site','mode'].includes(e.target.id)){state[e.target.id]=e.target.value;repaint();}if(e.target.dataset.col){const k=currentKey(),c=e.target.dataset.col;state.hidden[k]=e.target.checked?(state.hidden[k]||[]).filter(x=>x!==c):[...(state.hidden[k]||[]),c];$('#gridbody').innerHTML=gridBody();}});
$('#theme').onclick=()=>{const dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'light';$('#theme').innerHTML=icon(dark?'sun':'moon');$('#theme').setAttribute('aria-label','Switch to '+(dark?'light':'dark')+' theme');};
$('#menu').innerHTML=icon('menu');$('#menu').onclick=()=>{const on=$('#shell').classList.toggle('menuopen');$('#menu').setAttribute('aria-expanded',String(on));};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.querySelectorAll('details[open]').forEach(d=>d.open=false);$('#shell').classList.remove('menuopen');$('#menu').setAttribute('aria-expanded','false');}if(e.target.matches('[role=tab]')&&['ArrowRight','ArrowLeft'].includes(e.key)){e.preventDefault();const tabs=[...document.querySelectorAll('[role=tab]')],idx=tabs.indexOf(e.target),target=tabs[(idx+(e.key==='ArrowRight'?1:tabs.length-1))%tabs.length];target.click();}});
$('#scopefoot').textContent=D.dcs.length+' controllers · '+new Set(D.dcs.map(d=>d.Domain)).size+' domain(s) · v'+M.version;$('#generated').textContent=M.generatedDisplay;$('#sourcebadge').textContent=M.dataSource==='Sample'?'SAMPLE DATA':'LIVE SNAPSHOT';$('#brandicon').textContent='JP';$('#theme').innerHTML=icon('moon');$('#shell').hidden=false;render();
</script></body></html>
